<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğum Günün Kutlu Olsun</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #050510; /* Gece gökyüzü hissi veren çok koyu lacivert/siyah */
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Yazı ve pastayı ekranın ortasında birleştirir */
            align-items: center;
            height: 100vh;
            padding: 0;
            gap: 75px; /* Yazının alt kısmı ile mumların alevleri arasına çok ince bir boşluk bırakır */
            box-sizing: border-box;
        }

        /* --- ARKA PLAN (HAVAİ FİŞEK) --- */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .message-container {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            /* Önceki manuel boşluklar kaldırıldı, yerleşimi artık body gap ile yapıyoruz */
        }

        .message-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(35px, 6vw, 65px); /* Ekran boyutuna göre duyarlı boyut */
            color: #fff0f5; /* Hafif pembemsi beyaz */
            text-shadow: 0 0 5px #fff, 0 0 15px #ff1493, 0 0 25px #ff1493, 0 0 40px #ff00a0;
            opacity: 0;
            animation: textSlideDown 1s 0.5s ease-out forwards;
        }

        .message-name {
            font-family: 'Pacifico', cursive;
            font-size: clamp(45px, 8vw, 80px);
            color: #ffecd2; /* Şeftali/Turuncu tonları */
            margin-top: 5px;
            text-shadow: 0 0 5px #fff, 0 0 15px #ff8c00, 0 0 25px #ff7b00, 0 0 40px #ff5100;
            opacity: 0;
            animation: textSlideDown 1s 1.2s ease-out forwards;
        }

        .message-note {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(20px, 4vw, 35px);
            color: #ffffff;
            font-weight: 400;
            margin-top: 15px;
            letter-spacing: 1px;
            opacity: 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: textSlideDown 1s 2s ease-out forwards;
        }

        .cake-wrapper {
            position: relative;
            z-index: 10;
            transform: scale(0.9); /* Küçük ekranlarda taşmaması için hafif küçültme */
        }

        @media (max-width: 600px) {
            .cake-wrapper { transform: scale(0.6); } /* Mobil için boşluklar flexbox'a bırakıldı */
        }

        /* Gümüş Görünümlü 3D Tabak */
        .plate {
            width: 460px;
            height: 70px;
            background: radial-gradient(ellipse at center, #f5f5f5 0%, #b0b5b9 60%, #6c757d 100%);
            border-radius: 50%;
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 
                inset 0 -5px 15px rgba(255,255,255,0.6),
                inset 0 10px 15px rgba(0,0,0,0.5),
                0 20px 30px rgba(0,0,0,0.8);
            border: 2px solid #e9ecef;
            z-index: 1;
        }

        /* Koyu Mor Pasta Gövdesi */
        .cake {
            width: 360px;
            height: 170px; /* Daha uzun yapıldı */
            background: linear-gradient(to right, #5e35b1, #7e57c2, #5e35b1); /* Silindirik gölge efekti */
            position: relative;
            border-radius: 15px 15px 5px 5px;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.3), inset 15px 0 20px rgba(255,255,255,0.1);
            z-index: 2;
        }

        /* Açık Mor Eriyen Krema (Icing) */
        .icing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #b388ff;
            border-radius: 15px 15px 10px 10px;
            z-index: 3;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.4);
        }

        /* Krema Damlaları (Drips) */
        .drip {
            position: absolute;
            background: #b388ff;
            border-radius: 0 0 50px 50px;
            top: 40px; /* Kremanın altından başlar */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .candle-container {
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 4;
        }

        /* Pembe Mumlar */
        .candle {
            background: linear-gradient(to right, #ff80ab, #ff4081, #ff80ab);
            border-radius: 3px;
            width: 8px; /* İnce ve zarif mumlar */
            height: 45px;
            position: absolute;
            transform: translateY(-1000px);
            animation: dropIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            box-shadow: inset -2px 0 3px rgba(0,0,0,0.2);
        }

        /* Ateş Efekti */
        .fire {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 16px;
            background: #ffc107;
            border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
            animation: flicker 0.15s infinite alternate;
            box-shadow: 0 0 10px #ffeb3b, 0 0 20px #ff9800, 0 0 30px #ff5722;
        }

        @keyframes dropIn { to { transform: translateY(0); } }
        
        @keyframes textSlideDown { 
            from { opacity: 0; transform: translateY(-30px); filter: brightness(0.5); } 
            to { opacity: 1; transform: translateY(0); filter: brightness(1); } 
        }
        
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.9; background: #ffc107; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; background: #ffeb3b; }
        }

    </style>
</head>
<body>

    <!-- Arka Plan Havai Fişek -->
    <canvas id="canvas"></canvas>

    <!-- Yazı Alanı -->
    <div class="message-container">
        <div class="message-title">Doğum Gününüz Kutlu Olsun</div>
        <div class="message-name">Feride Hocam</div>
        <div class="message-note">Sizi Çok Seviyorum</div>
    </div>

    <!-- Pasta Alanı -->
    <div class="cake-wrapper">
        <div class="cake">
            <!-- Açık Mor Krema ve Damlaları -->
            <div class="icing">
                <!-- Manuel olarak konumlandırılmış damlalar -->
                <div class="drip" style="left: 15px; height: 60px; width: 22px;"></div>
                <div class="drip" style="left: 45px; height: 40px; width: 28px;"></div>
                <div class="drip" style="left: 85px; height: 75px; width: 20px;"></div>
                <div class="drip" style="left: 120px; height: 50px; width: 30px;"></div>
                <div class="drip" style="left: 165px; height: 85px; width: 25px;"></div>
                <div class="drip" style="left: 210px; height: 45px; width: 22px;"></div>
                <div class="drip" style="left: 245px; height: 65px; width: 28px;"></div>
                <div class="drip" style="left: 290px; height: 35px; width: 20px;"></div>
                <div class="drip" style="left: 325px; height: 55px; width: 22px;"></div>
            </div>
            
            <div id="candles" class="candle-container">
                <!-- Mumlar JS ile buraya eklenecek -->
            </div>
        </div>
        <div class="plate"></div>
    </div>

    <script>
        const candleBox = document.getElementById('candles');
        const candleCount = 28; // İstenilen mum sayısı
        const cakeWidth = 360;

        for (let i = 0; i < candleCount; i++) {
            const candle = document.createElement('div');
            candle.className = 'candle';
            
            // Animasyon gecikmesini ayarlama
            candle.style.animationDelay = (i * 0.04) + 's';
            
            // Mumları yatayda orantılı dağıtma (biraz kenar boşluğu bırakarak)
            const padding = 20;
            const availableWidth = cakeWidth - (padding * 2);
            const percentage = i / (candleCount - 1); // 0 ile 1 arası
            const leftPos = padding + (percentage * availableWidth);
            
            // Mumları hafif bir kavis (yay) oluşturacak şekilde dikeyde yerleştirme
            // Math.sin kullanarak ortadakileri biraz daha önde (aşağıda) gösterelim
            const curve = Math.sin(percentage * Math.PI) * 12; // Max 12px kavis
            
            candle.style.left = leftPos + 'px';
            candle.style.bottom = curve + 'px'; // Kavis efekti
            
            const fire = document.createElement('div');
            fire.className = 'fire';
            
            candle.appendChild(fire);
            candleBox.appendChild(candle);
        }

        window.requestAnimFrame = (function(){
          return window.requestAnimationFrame || 
                 window.webkitRequestAnimationFrame || 
                 window.mozRequestAnimationFrame || 
                 function( callback ){ window.setTimeout(callback, 1000 / 60); };
        })();

        var canvas = document.getElementById( 'canvas' ),
            ctx = canvas.getContext( '2d' ),
            cw = window.innerWidth,
            ch = window.innerHeight,
            fireworks = [],
            particles = [],
            timerTotal = 20, // Ateşleme sıklığı
            timerTick = 0;
            
        canvas.width = cw;
        canvas.height = ch;

        function random( min, max ) { return Math.random() * ( max - min ) + min; }

        function Firework( sx, sy, tx, ty ) {
            this.x = sx; this.y = sy; this.sx = sx; this.sy = sy;
            this.tx = tx; this.ty = ty;
            this.distanceToTarget = Math.sqrt(Math.pow(sx - tx, 2) + Math.pow(sy - ty, 2));
            this.distanceTraveled = 0;
            this.coordinates = [];
            this.coordinateCount = 3;
            while( this.coordinateCount-- ) { this.coordinates.push( [ this.x, this.y ] ); }
            this.angle = Math.atan2( ty - sy, tx - sx );
            this.speed = 2;
            this.acceleration = 1.05;
            this.brightness = random( 50, 70 );
            // Havai fişek rengini rastgele ama parlak renklerden seç (Görseldeki gibi Pembe, Mavi, Altın)
            this.targetHue = random( 0, 360 );
        }

        Firework.prototype.update = function( index ) {
            this.coordinates.pop();
            this.coordinates.unshift( [ this.x, this.y ] );
            this.speed *= this.acceleration;
            var vx = Math.cos( this.angle ) * this.speed, vy = Math.sin( this.angle ) * this.speed;
            this.distanceTraveled = Math.sqrt(Math.pow(this.sx - (this.x + vx), 2) + Math.pow(this.sy - (this.y + vy), 2));
            if( this.distanceTraveled >= this.distanceToTarget ) {
                createParticles( this.tx, this.ty, this.targetHue );
                fireworks.splice( index, 1 );
            } else { this.x += vx; this.y += vy; }
        }

        Firework.prototype.draw = function() {
            ctx.beginPath();
            ctx.moveTo( this.coordinates[ this.coordinates.length - 1 ][ 0 ], this.coordinates[ this.coordinates.length - 1 ][ 1 ] );
            ctx.lineTo( this.x, this.y );
            ctx.strokeStyle = 'hsl(' + this.targetHue + ', 100%, ' + this.brightness + '%)';
            ctx.stroke();
        }

        function Particle( x, y, hue ) {
            this.x = x; this.y = y;
            this.coordinates = [];
            this.coordinateCount = 5;
            while( this.coordinateCount-- ) { this.coordinates.push( [ this.x, this.y ] ); }
            this.angle = random( 0, Math.PI * 2 );
            this.speed = random( 1, 10 );
            this.friction = 0.95;
            this.gravity = 1;
            // Verilen hedefe yakın rastgele tonlar
            this.hue = random( hue - 30, hue + 30 );
            this.brightness = random( 50, 80 );
            this.alpha = 1;
            this.decay = random( 0.015, 0.03 );
        }

        Particle.prototype.update = function( index ) {
            this.coordinates.pop();
            this.coordinates.unshift( [ this.x, this.y ] );
            this.speed *= this.friction;
            this.x += Math.cos( this.angle ) * this.speed;
            this.y += Math.sin( this.angle ) * this.speed + this.gravity;
            this.alpha -= this.decay;
            if( this.alpha <= this.decay ) { particles.splice( index, 1 ); }
        }

        Particle.prototype.draw = function() {
            ctx.beginPath();
            ctx.moveTo( this.coordinates[ this.coordinates.length - 1 ][ 0 ], this.coordinates[ this.coordinates.length - 1 ][ 1 ] );
            ctx.lineTo( this.x, this.y );
            ctx.strokeStyle = 'hsla(' + this.hue + ', 100%, ' + this.brightness + '%, ' + this.alpha + ')';
            ctx.stroke();
        }

        function createParticles( x, y, hue ) {
            var particleCount = 40; 
            while( particleCount-- ) { particles.push( new Particle( x, y, hue ) ); }
        }

        function loop() {
            requestAnimFrame( loop );
            
            // Arkada yavaşça kaybolan gölgeler efekti (Daha karanlık gökyüzü)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; 
            ctx.fillRect( 0, 0, cw, ch );
            ctx.globalCompositeOperation = 'lighter';
            
            var i = fireworks.length;
            while( i-- ) { fireworks[ i ].draw(); fireworks[ i ].update( i ); }
            
            var i = particles.length;
            while( i-- ) { particles[ i ].draw(); particles[ i ].update( i ); }

            if( timerTick >= timerTotal ) {
                // Rastgele konumlardan gökyüzüne havai fişek fırlat
                fireworks.push( new Firework( cw / 2, ch, random( 0, cw ), random( 0, ch / 1.5 ) ) );
                fireworks.push( new Firework( random(0, cw), ch, random( 0, cw ), random( 0, ch / 1.5 ) ) );
                timerTick = 0;
            } else { timerTick++; }
        }

        window.addEventListener('resize', function() {
            cw = window.innerWidth; ch = window.innerHeight;
            canvas.width = cw; canvas.height = ch;
        });

        // Başlat
        loop();
    </script>
</body>
</html>
